[project]
name = "lake-explorer"
version = "0.1.0"
description = "Read-only explorer for the DHA data lake: inventory, change tracking and ad-hoc SQL"
authors = [
    { name = "Koske Danson", email = "koskedk@live.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyiceberg[pyarrow]>=0.9",
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
lake-explorer = "lake_explorer:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"
