# Read-only door to the stand-in's built-in file browser.
# The browser page itself asks for no key and can upload, rename and delete,
# so only requests that read (GET, HEAD) are passed on. Everything else is refused.
server {
    listen 8080;
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://standin-s3:8888;
        proxy_set_header Host $host;
    }
}
